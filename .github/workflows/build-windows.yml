name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --onefile --windowed --name StorageCleaner app.py

      - name: Zip EXE
        shell: pwsh
        run: Compress-Archive -Path dist\StorageCleaner.exe -DestinationPath StorageCleaner-Windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StorageCleaner-Windows-x64
          path: StorageCleaner-Windows-x64.zip
